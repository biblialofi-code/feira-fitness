<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Score de Conversão — Fitness Brasil Expo 2026</title>
<style>
  :root{
    --ink:#0E1B2C; --ink-2:#1D3049;
    --paper:#F5F1E8; --paper-2:#ECE5D6; --line:#D8CFBC;
    --accent:#0FB5A6; --accent-deep:#0A8378; --coral:#FF6B54; --muted:#6C7787;
    --green:#4CAF3F; --green-deep:#2E7D26;
    --bot-bubble:#FFFFFF; --user-bubble:#0E1B2C;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1000px 500px at 50% -10%, rgba(15,181,166,.12), transparent 55%), var(--paper);
    color:var(--ink); display:flex;flex-direction:column;align-items:center;
    min-height:100dvh;padding:16px 14px;
  }
  .frame{width:100%;max-width:480px;display:flex;flex-direction:column;flex:1}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:4px;justify-content:center}
  .brand .mark{width:26px;height:26px;border-radius:7px;background:conic-gradient(from 210deg,var(--accent),var(--ink) 70%)}
  .brand b{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
  .event{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);font-weight:700;margin-bottom:14px}

  .chat{flex:1;background:var(--paper-2);border:1px solid var(--line);border-radius:18px;padding:16px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:11px;min-height:400px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 30px -18px rgba(14,27,44,.35);scroll-behavior:smooth}
  .row{display:flex;gap:8px;align-items:flex-end;animation:rise .3s ease both}
  .row.user{flex-direction:row-reverse}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .av{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
  .av.bot{background:conic-gradient(from 210deg,var(--accent),var(--ink) 75%)}
  .av.user{background:var(--ink-2);color:var(--paper)}
  .bubble{max-width:84%;padding:11px 13px;border-radius:15px;font-size:14.5px;line-height:1.5;box-shadow:0 1px 2px rgba(14,27,44,.08)}
  .row.bot .bubble{background:var(--bot-bubble);border-bottom-left-radius:5px}
  .row.user .bubble{background:var(--user-bubble);color:var(--paper);border-bottom-right-radius:5px}
  .bubble b{font-weight:700}

  .dots{display:inline-flex;gap:4px;padding:3px 2px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-2px)}}

  .dock{margin-top:11px;display:flex;flex-direction:column;gap:9px}
  .chips{display:flex;flex-direction:column;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:13px 15px;border-radius:13px;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s;text-align:left;line-height:1.35}
  .chip:active{transform:scale(.98)}
  .chip:hover{border-color:var(--accent);color:var(--accent-deep)}
  .composer{display:flex;gap:8px}
  .composer input{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 15px;font-size:16px;color:var(--ink);outline:none}
  .composer input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,181,166,.15)}
  .send{border:none;background:var(--ink);color:#fff;border-radius:12px;padding:0 20px;font-size:15px;font-weight:700;cursor:pointer;flex:none}
  .send:active{transform:scale(.97)}

  /* score card */
  .scorecard{background:var(--ink);color:#fff;border-radius:18px;padding:22px 18px;text-align:center;margin:2px 0;animation:rise .4s ease both}
  .scorecard .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8FA6C4;font-weight:700}
  .scorecard .num{font-size:64px;font-weight:800;line-height:1;margin:6px 0;color:var(--accent)}
  .scorecard .out{font-size:15px;color:#8FA6C4}
  .scorecard .band{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px}
  .scorecard .pos{margin-top:12px;font-size:14px;color:#fff}
  .scorecard .pos b{color:var(--accent)}
  .gargalo{background:#fff;border:1px solid var(--line);border-left:4px solid var(--coral);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;margin-top:2px}
  .gargalo .t{font-weight:800;color:var(--coral);text-transform:uppercase;font-size:11px;letter-spacing:.08em}

  .foot{font-size:10.5px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5}
  .consent{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;line-height:1.4}
  .consent input{margin-top:2px;width:18px;height:18px;flex:none}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="frame">
  <div class="brand"><span class="mark"></span><b>Addsales</b></div>
  <div class="event">Ranking de Conversão · Fitness Brasil Expo 2026</div>
  <div class="chat" id="chat"></div>
  <div class="dock" id="dock">
    <div class="chips" id="chips"></div>
    <div class="composer hidden" id="composer">
      <input id="input" type="text" autocomplete="off" />
      <button class="send" id="send">OK</button>
    </div>
  </div>
  <div class="foot">Diagnóstico gratuito · Fitness Brasil Expo 2026 · powered by Rise</div>
</div>

<script>
const chat=document.getElementById('chat'), chips=document.getElementById('chips'),
      composer=document.getElementById('composer'), input=document.getElementById('input'),
      send=document.getElementById('send');

// ---------- as 6 perguntas de score (3 gargalos x 2) ----------
// cada opção tem pts (0 pior, 100 melhor). gargalo = eixo que a pergunta mede.
const PERGUNTAS=[
  {g:'Tempo de resposta', q:'Quando chega um lead novo (DM, WhatsApp, formulário), em quanto tempo alguém responde?',
   opts:[['Em minutos',100],['Em algumas horas',60],['No dia seguinte',30],['Às vezes fica sem resposta',0]]},
  {g:'Tempo de resposta', q:'Fora do horário comercial, o interessado recebe alguma resposta?',
   opts:[['Sim, automática na hora',100],['Sim, mas demora',55],['Só no dia seguinte',25],['Não recebe nada',0]]},
  {g:'Follow-up', q:'Quando alguém pede informação e não fecha na hora, vocês voltam a procurar essa pessoa?',
   opts:[['Sempre, de forma organizada',100],['Às vezes, quando lembram',50],['Quase nunca',20],['A bola fica com o cliente',0]]},
  {g:'Follow-up', q:'Quando voltam a falar com um interessado, é uma vez só ou uma sequência de contatos?',
   opts:[['Uma sequência planejada',100],['Duas ou três tentativas',65],['Só uma vez',30],['Não voltam',0]]},
  {g:'Aula experimental', q:'Depois que a pessoa faz a aula experimental e não matricula na hora, alguém fala com ela de novo?',
   opts:[['Sempre, com follow-up',100],['Às vezes',50],['Raramente',20],['Nunca',0]]},
  {g:'Aula experimental', q:'Vocês sabem quantos dos que fazem experimental viram matrícula?',
   opts:[['Sim, medimos de perto',100],['Temos uma ideia',55],['Não medimos',15],['Nem sei quantos fazem',0]]},
];

// ---------- campos de cadastro (no fim) ----------
const CAMPOS=[
  {k:'nome',      label:'Seu nome',                      type:'text',   ph:'Nome completo'},
  {k:'funcao',    label:'Sua função',                    type:'text',   ph:'Ex: dono, gerente, marketing'},
  {k:'academia',  label:'Nome da academia',              type:'text',   ph:'Nome da academia'},
  {k:'unidades',  label:'Quantas unidades?',             type:'num',    ph:'Ex: 1, 3, 10'},
  {k:'alunos',    label:'Quantos alunos ativos hoje?',   type:'num',    ph:'Número aproximado'},
  {k:'inativos',  label:'E quantos alunos inativos / que já saíram?', type:'num', ph:'Número aproximado'},
  {k:'telefone',  label:'WhatsApp',                      type:'text',   ph:'(00) 00000-0000'},
  {k:'email',     label:'E-mail',                        type:'text',   ph:'seu@email.com'},
];

const RANKING_MIN=20; // só mostra posição no ranking depois de N academias

const state={fase:'intro', pi:0, respostas:[], score:0, gargalo:'', cadastro:{}, ci:0, consent:false, totalFeira:0, posicao:0};

function addRow(role,html){const r=document.createElement('div');r.className='row '+role;r.innerHTML=`<div class="av ${role}">${role==='user'?'V':''}</div><div class="bubble">${html}</div>`;chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return r;}
function addCard(html){const r=document.createElement('div');r.innerHTML=html;chat.appendChild(r.firstElementChild);chat.scrollTop=chat.scrollHeight;}
function typing(){const r=document.createElement('div');r.className='row bot';r.id='typing';r.innerHTML=`<div class="av bot"></div><div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>`;chat.appendChild(r);chat.scrollTop=chat.scrollHeight;}
function stopTyping(){const t=document.getElementById('typing');if(t)t.remove();}
function botSay(html,delay=550){return new Promise(res=>{typing();setTimeout(()=>{stopTyping();addRow('bot',html);res();},delay);});}
function setChips(list){chips.innerHTML='';composer.classList.add('hidden');list.forEach(([label,val])=>{const b=document.createElement('button');b.className='chip';b.textContent=label;b.onclick=()=>pick(val,label);chips.appendChild(b);});}
function askText(ph,type){chips.innerHTML='';composer.classList.remove('hidden');input.value='';input.placeholder=ph||'';input.type=(type==='num')?'tel':'text';input.focus();}
function clearInputArea(){chips.innerHTML='';composer.classList.add('hidden');}

// ---------- fluxo ----------
async function start(){
  await botSay(`Bem-vindo ao <b>Ranking de Conversão</b> da Fitness Brasil Expo 2026. 🏋️`,500);
  await botSay(`Em 1 minuto eu calculo o <b>Score de Conversão</b> da sua academia — o quanto vocês transformam interessados em matrículas — e te mostro onde você está no ranking da feira.`,800);
  await botSay(`São 6 perguntas rápidas. Bora?`,600);
  setChips([['Bora 🚀','__go']]);
}

async function pick(val,label){
  if(val==='__go'){ state.fase='perguntas'; return proximaPergunta(); }

  if(state.fase==='perguntas'){
    addRow('user',label);
    const p=PERGUNTAS[state.pi];
    state.respostas.push({g:p.g, pts:val});
    state.pi++;
    return proximaPergunta();
  }
}

async function proximaPergunta(){
  if(state.pi<PERGUNTAS.length){
    const p=PERGUNTAS[state.pi];
    await botSay(`<b>${state.pi+1}/6.</b> ${p.q}`,450);
    setChips(p.opts.map(o=>[o[0],o[1]]));
    return;
  }
  // acabou -> calcula score
  return calcular();
}

async function calcular(){
  clearInputArea();
  const total=state.respostas.reduce((s,r)=>s+r.pts,0);
  state.score=Math.round(total/state.respostas.length);
  // gargalo = eixo com menor média
  const porG={};
  state.respostas.forEach(r=>{(porG[r.g]=porG[r.g]||[]).push(r.pts)});
  let pior=null,piorMedia=999;
  for(const g in porG){const m=porG[g].reduce((a,b)=>a+b,0)/porG[g].length; if(m<piorMedia){piorMedia=m;pior=g;}}
  state.gargalo=pior;

  await botSay(`Pronto! Calculei o seu Score de Conversão. 👇`,700);
  await gravarEObterRanking();
  mostrarScore();
}

// grava no supabase e recebe total + posição
async function gravarEObterRanking(){
  try{
    const r=await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({acao:'registrar_score', score:state.score, gargalo:state.gargalo})});
    const d=await r.json();
    if(d && typeof d.total==='number'){ state.totalFeira=d.total; state.posicao=d.posicao||0; }
  }catch(e){/* ranking é bônus, não trava */}
}

function bandFor(s){
  if(s>=80) return ['Excelente','#DFF5DE','#2E7D26'];
  if(s>=60) return ['Boa, com espaço pra crescer','#FFF3D6','#B8860B'];
  if(s>=40) return ['Zona de atenção','#FFE6DC','#C0492B'];
  return ['Zona de risco','#FFDDD6','#B3241C'];
}

function mostrarScore(){
  const [bt,bg,bc]=bandFor(state.score);
  let posHTML='';
  if(state.totalFeira>=RANKING_MIN && state.posicao){
    posHTML=`<div class="pos">No ranking da feira: <b>${state.posicao}º de ${state.totalFeira}</b> academias</div>`;
  }else{
    posHTML=`<div class="pos">Você é uma das <b>${state.totalFeira||1}</b> academias já avaliadas hoje</div>`;
  }
  addCard(`<div class="scorecard">
    <div class="lab">Seu Score de Conversão</div>
    <div class="num">${state.score}</div>
    <div class="out">de 100</div>
    <div class="band" style="background:${bg};color:${bc}">${bt}</div>
    ${posHTML}
  </div>`);
  addCard(`<div class="gargalo"><span class="t">Seu principal gargalo</span><br>${gargaloTexto(state.gargalo)}</div>`);
  setTimeout(ofertaPlano,700);
}

function gargaloTexto(g){
  const map={
    'Tempo de resposta':'<b>Tempo de resposta.</b> Interessado que não é respondido rápido esfria — e some. É onde vocês mais perdem matrícula hoje.',
    'Follow-up':'<b>Follow-up.</b> Quem pede informação e não fecha na hora quase sempre precisa de um segundo toque. Sem isso, o lead evapora.',
    'Aula experimental':'<b>Aula experimental.</b> A pessoa já veio até a academia — não voltar a falar com ela depois da experimental é deixar dinheiro na porta.'
  };
  return map[g]||g;
}

async function ofertaPlano(){
  await botSay(`Quer o <b>plano de ação personalizado</b> pra atacar esse gargalo — e travar sua posição no ranking da feira?`,600);
  await botSay(`É só me dizer pra onde mando. Leva 30 segundos.`,600);
  setChips([['Quero meu plano 📋','__cad']]);
}

async function pickCad(){
  state.fase='cadastro'; state.ci=0; clearInputArea();
  await botSay(`Show. Me passa alguns dados rápidos pra montar seu plano e sua posição oficial.`,500);
  proximoCampo();
}

async function proximoCampo(){
  if(state.ci<CAMPOS.length){
    const c=CAMPOS[state.ci];
    await botSay(c.label+':',350);
    askText(c.ph,c.type);
    return;
  }
  return consentimento();
}

function consentimento(){
  clearInputArea();
  const wrap=document.createElement('div');
  wrap.innerHTML=`<label class="consent"><input type="checkbox" id="okc"> Autorizo a Addsales a entrar em contato comigo com meu diagnóstico e ofertas relacionadas. Meus dados serão tratados conforme a LGPD.</label>`;
  chips.appendChild(wrap.firstElementChild);
  const b=document.createElement('button');b.className='chip';b.style.textAlign='center';b.style.borderColor='var(--accent)';b.style.color='var(--accent-deep)';b.textContent='Gerar meu plano ✅';
  b.onclick=async()=>{
    if(!document.getElementById('okc').checked){ b.textContent='Marque a autorização acima ☝️'; return; }
    state.consent=true; clearInputArea(); await finalizar();
  };
  chips.appendChild(b);
}

async function submitText(v){
  if(state.fase==='cadastro'){
    const c=CAMPOS[state.ci];
    addRow('user',v);
    state.cadastro[c.k]=v;
    state.ci++;
    return proximoCampo();
  }
}

async function finalizar(){
  await botSay(`Perfeito, ${state.cadastro.nome||''}! Gerando seu plano de ação...`,600);
  const plano=await gerarPlano();
  if(plano){ await botSay(plano.replace(/\n/g,'<br>'),400); }
  else{
    await botSay(planoFallback(),400);
  }
  // grava cadastro completo
  try{
    fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({acao:'registrar_lead', score:state.score, gargalo:state.gargalo, cadastro:state.cadastro})});
  }catch(e){}
  await botSay(`Seu plano também vai pro seu e-mail. Passa lá no nosso estande pra gente conversar sobre como recuperar sua base parada. 💪`,700);
  await botSay(`<b>Obrigado por participar do Ranking de Conversão da Fitness Brasil Expo 2026!</b>`,600);
}

async function gerarPlano(){
  const sys=`Você é consultor da Addsales, empresa que faz recuperação de vendas e reativação de base pra academias. Gere um plano de ação curto e prático (3 passos, no máximo 5 frases no total) pra uma academia melhorar a conversão de interessados em matrículas, focado no gargalo principal dela. Tom direto, brasileiro, sem enrolação, sem emoji. Não invente números nem prometa resultado. Não cite preço. Termine deixando claro que a Addsales pode operar isso pra ela.`;
  const ctx=`Gargalo principal: ${state.gargalo}. Score: ${state.score}/100. Academia: ${state.cadastro.academia||'-'}, ${state.cadastro.unidades||'?'} unidade(s), ${state.cadastro.alunos||'?'} alunos ativos, ${state.cadastro.inativos||'?'} inativos.`;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system:sys,messages:[{role:'user',content:ctx}]})});
    const d=await r.json();
    return (d&&d.text)?d.text:null;
  }catch(e){ return null; }
}
function planoFallback(){
  const base={
    'Tempo de resposta':'<b>Seu plano:</b><br>1. Coloque um primeiro retorno automático em até 5 minutos pra todo lead novo.<br>2. Defina um responsável por responder DMs e WhatsApp em horário fixo.<br>3. Cubra o fora-de-horário com uma resposta automática que já agenda a visita.<br>A Addsales pode operar essa reabordagem pra você.',
    'Follow-up':'<b>Seu plano:</b><br>1. Crie uma sequência de 3 contatos pra quem pediu informação e não fechou.<br>2. Registre cada interessado num lugar só, pra ninguém se perder.<br>3. Reative quem sumiu com uma oferta de retorno.<br>A Addsales pode rodar esse follow-up pra você.',
    'Aula experimental':'<b>Seu plano:</b><br>1. Todo mundo que faz experimental entra numa régua de follow-up nas 48h seguintes.<br>2. Meça quantos experimentais viram matrícula — sem medir, não dá pra melhorar.<br>3. Reaborde quem fez experimental e não voltou.<br>A Addsales pode operar isso pra você.'
  };
  return base[state.gargalo]||'Seu plano será enviado por e-mail.';
}

// eventos
send.onclick=()=>{const v=input.value.trim();if(!v)return;input.value='';submitText(v);};
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send.click();}});

// intercepta o chip de cadastro
const _pick=pick;
pick=function(val,label){ if(val==='__cad'){return pickCad();} return _pick(val,label); };

window.addEventListener('load',start);
</script>
</body>
</html>
